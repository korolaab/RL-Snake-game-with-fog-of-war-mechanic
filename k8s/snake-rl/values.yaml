# ==== GLOBAL CONFIGURATION ====
global:
  imageRegistry: "localhost:5000"
  imageTag: "latest"
  imagePullPolicy: Always

# ==== EXPERIMENT CONFIGURATION ====
experiment:
  name: "snake-rl-shared-memory"
  maxEpisodes: 1000                    # Configurable termination
  
# ==== MLFLOW CONFIGURATION ====  
mlflow:
  enabled: true                        # Can disable MLflow entirely
  trackingUri: ""                      # Empty = file-based in PVC
  experimentName: "snake-rl"           # MLflow experiment name
  
# ==== SERVICE PARAMETERS ====
clock:
  image:
    repository: "snake-rl/clock"
    tag: ""
  fps: 1.0
  visionSize: 5
  
env:
  image:
    repository: "snake-rl/env"
    tag: ""
  gridWidth: 11
  gridHeight: 11
  visionRadius: 5
  visionDisplayCols: 11
  visionDisplayRows: 11
  rewardConfig: '{"alive": 1, "eat_food": 10, "game_over": -10}'
  
inference:
  image:
    repository: "snake-rl/inference"
    tag: ""
  snakeId: 1
  learningRate: 0.001
  gamma: 0.99
  beta: 0.1

# ==== JOB CONFIGURATION ====
job:
  restartPolicy: Never
  ttlSecondsAfterFinished: 300
  backoffLimit: 0
  
# ==== STORAGE CONFIGURATION ====
storage:
  logs:
    enabled: true
    size: 10Gi
    storageClass: "local-path"
    accessMode: "ReadWriteOnce"
    
# ==== RESOURCE CONFIGURATION ====  
resources:
  clock:
    requests: 
      cpu: 100m
      memory: 128Mi
    limits: 
      cpu: 500m
      memory: 512Mi
  env:
    requests: 
      cpu: 200m
      memory: 256Mi
    limits: 
      cpu: 1000m
      memory: 1Gi
  inference:
    requests: 
      cpu: 500m
      memory: 512Mi
    limits: 
      cpu: 2000m
      memory: 2Gi

# ==== LEGACY CONFIGURATIONS (unused in shared memory) ====
createNamespace: false
rabbitmq:
  enabled: false
logging:
  level: "INFO"
networkPolicy:
  enabled: false

