{{- if .Values.profiling.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "snake-rl.fullname" . }}-inference-profiling
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snake-rl.labels" . | nindent 4 }}
    component: inference-profiling
spec:
  ttlSecondsAfterFinished: {{ .Values.profiling.ttlAfterFinished | default 3600 }}
  template:
    metadata:
      labels:
        {{- include "snake-rl.selectorLabels" . | nindent 8 }}
        component: inference-profiling
    spec:
      restartPolicy: Never
      containers:
      - name: inference-profiler
        image: {{ .Values.inference.image.repository }}:{{ .Values.inference.image.tag }}
        workingDir: /app/services/Inference
        command:
        - python
        - "-m"
        - cProfile
        - "-o"
        - /profiling-data/inference_profile_{{ .Values.profiling.timestamp | default "latest" }}.prof
        - src/main.py
        args:
        - --snake-id
        - profiling-snake-{{ .Values.profiling.timestamp | default "latest" }}
        - --env-host
        - {{ include "snake-rl.fullname" . }}-env:5000
        - --max-episodes
        - {{ .Values.profiling.inference.maxEpisodes | default "50" | quote }}
        - --learning-rate
        - {{ .Values.profiling.inference.learningRate | default "0.001" | quote }}
        - --batch-size
        - {{ .Values.profiling.inference.batchSize | default "5" | quote }}
        env:
        - name: PROFILING_MODE
          value: "true"
        - name: LOG_LEVEL
          value: {{ .Values.profiling.inference.logLevel | default "ERROR" | quote }}
        - name: N_EPISODES
          value: {{ .Values.profiling.inference.maxEpisodes | default "50" | quote }}
        volumeMounts:
        - name: profiling-storage
          mountPath: /profiling-data
        resources:
          requests:
            memory: {{ .Values.profiling.inference.resources.requests.memory | default "1Gi" }}
            cpu: {{ .Values.profiling.inference.resources.requests.cpu | default "1" }}
          limits:
            memory: {{ .Values.profiling.inference.resources.limits.memory | default "4Gi" }}
            cpu: {{ .Values.profiling.inference.resources.limits.cpu | default "2" }}
      - name: profile-analyzer
        image: python:3.9-slim
        command:
        - sh
        - -c
        - |
          echo "Waiting for inference profiling to complete..."
          
          # Wait for profiling to start
          sleep 30
          
          # Wait for profile file to appear and profiling to complete
          while [ ! -f /profiling-data/inference_profile_{{ .Values.profiling.timestamp | default "latest" }}.prof ]; do
            echo "Waiting for profiling file to appear..."
            sleep 30
          done
          
          # Wait a bit more for profiling to finish writing
          sleep 60
          
          echo "=== Generating Inference Profile Report ==="
          python -c "
          import pstats
          import os
          import time
          
          profile_file = '/profiling-data/inference_profile_{{ .Values.profiling.timestamp | default "latest" }}.prof'
          
          print(f'Analyzing profile file: {profile_file}')
          
          if os.path.exists(profile_file):
              print(f'Profile file size: {os.path.getsize(profile_file)} bytes')
              ps = pstats.Stats(profile_file)
              
              analysis_file = '/profiling-data/inference_analysis_{{ .Values.profiling.timestamp | default "latest" }}.txt'
              with open(analysis_file, 'w') as f:
                  f.write('=== INFERENCE SERVICE PROFILING ANALYSIS ===\n')
                  f.write('Profile file: {}\n'.format(profile_file))
                  f.write('Analysis time: {}\n\n'.format(time.strftime('%Y-%m-%d %H:%M:%S')))
                  
                  f.write('=== TOP 30 FUNCTIONS BY TOTAL TIME ===\n')
                  ps.sort_stats('tottime')
                  ps.print_stats(30, stream=f)
                  
                  f.write('\n=== TOP 30 FUNCTIONS BY CUMULATIVE TIME ===\n')
                  ps.sort_stats('cumulative')
                  ps.print_stats(30, stream=f)
                  
                  f.write('\n=== HTTP REQUEST BOTTLENECKS ===\n')
                  ps.print_stats('requests|http|urllib|socket', stream=f)
                  
                  f.write('\n=== NEURAL NETWORK BOTTLENECKS ===\n')
                  ps.print_stats('torch|tensor|model|forward|backward', stream=f)
                  
                  f.write('\n=== STATE PROCESSING BOTTLENECKS ===\n')
                  ps.print_stats('state_processor|process_state|visible', stream=f)
                  
                  f.write('\n=== JSON/SERIALIZATION ===\n')
                  ps.print_stats('json|dumps|loads', stream=f)
                  
                  f.write('\n=== TRAINING BOTTLENECKS ===\n')
                  ps.print_stats('train|loss|backward|optimizer|step', stream=f)
              
              # Generate summary
              summary_file = '/profiling-data/inference_summary_{{ .Values.profiling.timestamp | default "latest" }}.txt'
              with open(summary_file, 'w') as f:
                  f.write('=== INFERENCE PROFILING SUMMARY ===\n')
                  ps.sort_stats('tottime')
                  ps.print_stats(10, stream=f)
              
              print('Inference profiling analysis complete!')
              print('Files created:')
              os.system('ls -la /profiling-data/')
              
          else:
              print(f'ERROR: Profile file not found at {profile_file}')
              print('Available files in /profiling-data/:')
              os.system('ls -la /profiling-data/')
          "
        volumeMounts:
        - name: profiling-storage
          mountPath: /profiling-data
      volumes:
      - name: profiling-storage
        persistentVolumeClaim:
          claimName: {{ include "snake-rl.fullname" . }}-profiling-pvc
{{- end }}