{{- if .Values.profiling.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "snake-rl.fullname" . }}-env-profiling
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snake-rl.labels" . | nindent 4 }}
    component: env-profiling
spec:
  ttlSecondsAfterFinished: {{ .Values.profiling.ttlAfterFinished | default 3600 }}
  template:
    metadata:
      labels:
        {{- include "snake-rl.selectorLabels" . | nindent 8 }}
        component: env-profiling
    spec:
      restartPolicy: Never
      containers:
      - name: env-profiler
        image: {{ .Values.env.image.repository }}:{{ .Values.env.image.tag | default .Values.global.imageTag }}
        workingDir: /app/services/Env
        command:
          - python
          - "-m"
          - cProfile
          - "-o"
          - "/profiling-data/env_profile_{{ .Values.profiling.timestamp | default "latest" }}.prof"
          - src/main.py
        env:
          - name: PROFILING_MODE
            value: "true"
          - name: LOG_LEVEL
            value: {{ .Values.profiling.env.logLevel | default "ERROR" | quote }}
        ports:
          - containerPort: 5000
        volumeMounts:
          - name: profiling-storage
            mountPath: /profiling-data
        resources:
          requests:
            memory: {{ .Values.profiling.env.resources.requests.memory | default "512Mi" }}
            cpu: {{ .Values.profiling.env.resources.requests.cpu | default "500m" }}
          limits:
            memory: {{ .Values.profiling.env.resources.limits.memory | default "2Gi" }}
            cpu: {{ .Values.profiling.env.resources.limits.cpu | default "1" }}
      - name: profile-analyzer
        image: python:3.9-slim
        command:
          - sh
          - "-c"
          - |
            echo "Waiting for environment profiling to start..."
            sleep {{ .Values.profiling.env.duration | default 300 }}
            
            echo "=== Generating Environment Profile Report ==="
            python -c "
            import pstats
            import os
            profile_file = '/profiling-data/env_profile_{{ .Values.profiling.timestamp | default "latest" }}.prof'
            
            print(f'Looking for profile file: {profile_file}')
            if os.path.exists(profile_file):
                print('Profile file found, generating analysis...')
                ps = pstats.Stats(profile_file)
                
                with open('/profiling-data/env_analysis_{{ .Values.profiling.timestamp | default "latest" }}.txt', 'w') as f:
                    f.write('=== ENVIRONMENT SERVICE PROFILING ANALYSIS ===\n')
                    f.write('Profile file: {}\n\n'.format(profile_file))
                    
                    f.write('=== TOP 20 FUNCTIONS BY TOTAL TIME ===\n')
                    ps.sort_stats('tottime')
                    ps.print_stats(20, stream=f)
                    
                    f.write('\n=== TOP 20 FUNCTIONS BY CUMULATIVE TIME ===\n')
                    ps.sort_stats('cumulative')
                    ps.print_stats(20, stream=f)
                    
                    f.write('\n=== FLASK/HTTP BOTTLENECKS ===\n')
                    ps.print_stats('flask|http|request|wsgi', stream=f)
                    
                    f.write('\n=== GAME LOGIC BOTTLENECKS ===\n') 
                    ps.print_stats('game|snake|vision|state', stream=f)
                    
                    f.write('\n=== JSON/SERIALIZATION ===\n')
                    ps.print_stats('json|dumps|loads|jsonify', stream=f)
                
                print('Environment profiling analysis complete!')
                print('Files created:')
                os.system('ls -la /profiling-data/')
            else:
                print(f'ERROR: Profile file not found at {profile_file}')
                print('Available files:')
                os.system('ls -la /profiling-data/')
            "
        volumeMounts:
          - name: profiling-storage
            mountPath: /profiling-data
      volumes:
        - name: profiling-storage
          persistentVolumeClaim:
            claimName: {{ include "snake-rl.fullname" . }}-profiling-pvc
{{- end }}