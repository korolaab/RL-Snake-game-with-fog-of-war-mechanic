global:
  imageRegistry: "localhost:5000"
  imageTag: "latest"
  imagePullPolicy: Always

env:
  enabled: false
  service:
    type: NodePort
    port: 5000
    targetPort: 5000
    nodePort: 8000
  
  resources:
    requests:
      memory: "128Mi"
      cpu: "1000m"
    limits:
      memory: "256Mi"
      cpu: "2000m"

  storage:
    enabled: true
    accessMode: "ReadWriteOnce"
    storageClass: "local-path"
    size: "5Gi"

envContainer:
  command: []
  args: []

training:
  enabled: true
  service:
    type: ClusterIP
    port: 50051
    targetPort: 50051
  args:
    port: "50051"

  resources:
    requests:
      memory: "256Mi"
      cpu: "2000m"
    limits:
      memory: "512Mi"
      cpu: "4000m"
  storage:
    enabled: true
    accessMode: "ReadWriteOnce"
    storageClass: "local-path"
    size: "5Gi"

inference:
  enabled: false
  args:
    envHost: "env:5000"
    grpcHost: "training"
    grpcPort: "50051"
  
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "400m"

  storage:
    enabled: true
    accessMode: "ReadWriteOnce"
    storageClass: "local-path"
    size: "5Gi"

inferenceContainer:
  command: []
  args: []

# Enable the Job for RL episodes
run:
  maxEpisodes: 100  # Set to a positive value to run the RL job
  ttlSecondsAfterFinished: 10  # (optional) Keep Job for 30 min after finish

rabbitmq:
  enabled: false

logging:
  level: "DEBUG"
  enableConsoleLogs: true

